<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Mastery Hub - Giao diện mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d946ef; /* Fuchsia-500 */
            --primary-hover: #c026d3; /* Fuchsia-600 */
            --primary-light: #fae8ff; /* Fuchsia-100 */
            --secondary: #db2777; /* Pink-600 */
            --text-primary: #1e293b; /* Slate-800 */
            --text-secondary: #475569; /* Slate-600 */
            --surface: #ffffff;
            --surface-alt: #f1f5f9; /* Slate-100 */
            --border: #e2e8f0; /* Slate-200 */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        html.dark {
            --primary: #e879f9; /* Fuchsia-400 */
            --primary-hover: #d946ef; /* Fuchsia-500 */
            --text-primary: #f1f5f9; /* Slate-100 */
            --text-secondary: #94a3b8; /* Slate-400 */
            --surface: #1e293b; /* Slate-800 */
            --surface-alt: #334155; /* Slate-700 */
            --border: #475569; /* Slate-600 */
        }
        
        html.dark body {
            background-color: #0f172a; /* Slate-900 */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23334155' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f8fafc; /* Slate-50 */
            color: var(--text-primary);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e2e8f0' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.025em; }
        .header h1 span { background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 1.125rem; color: var(--text-secondary); margin-top: 0.5rem; }
        .lookup-card { background-color: var(--surface); border-radius: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg); margin-bottom: 2rem; transition: background-color 0.3s, border-color 0.3s; }
        .input-group { display: flex; gap: 0.5rem; border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.5rem; transition: all 0.2s ease; }
        .input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.1); }
        .main-input { flex-grow: 1; border: none; outline: none; padding: 0.5rem 1rem; font-size: 1rem; background: transparent; color: var(--text-primary); }
        .icon-btn { background-color: transparent; border: none; padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; color: var(--text-secondary); transition: all 0.2s ease; }
        .icon-btn:hover { background-color: var(--surface-alt); color: var(--text-primary); }
        .primary-btn { background-color: var(--primary); color: white; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .primary-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
        .tabs-container { display: flex; gap: 0.5rem; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 0.75rem 1.25rem; border: none; background: transparent; color: var(--text-secondary); font-weight: 600; cursor: pointer; transition: all 0.2s ease; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 0.5rem; }
        .tab-btn.active, .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { border-bottom-color: var(--primary); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
        .feature-btn { background-color: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; text-align: left; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.75rem; color: var(--text-primary); }
        .feature-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--primary); color: var(--primary); }
        .feature-btn .icon { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border-radius: 0.5rem; background-color: var(--primary-light); color: var(--primary); flex-shrink: 0; }
        .feature-btn .pro-badge { background: linear-gradient(135deg, #facc15, #f59e0b); color: #422006; font-size: 0.65rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 9999px; margin-left: auto; text-transform: uppercase; }
        .external-links { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
        .external-links-title { font-weight: 600; color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .external-links .links-group { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .external-btn { background-color: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; }
        .external-btn:hover { color: var(--primary); border-color: var(--primary-light); background-color: var(--primary-light); }
        .message-alert { margin-top: 1.5rem; padding: 1rem 1.5rem; border-radius: 12px; font-weight: 500; text-align: center; display: none; transition: all 0.3s ease; border: 1px solid transparent; }
        .message-alert.show { display: block; animation: slideIn 0.3s ease-out; }
        .message-alert.error { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
        .message-alert.info { background: #dbeafe; color: #2563eb; border-color: #bfdbfe; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .content-section { background: var(--surface); border-radius: 20px; padding: 2.5rem; margin: 2rem 0; max-width: 1000px; box-shadow: var(--shadow-lg); display: none; position: relative; overflow: hidden; animation: fadeIn 0.5s ease-out; }
        .section-header{font-size:1.75rem;font-weight:700;color:var(--text-primary);margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:.75rem}
        .loading-overlay{position:absolute;inset:0;background:hsla(0,0%,100%,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border-radius:20px;transition:opacity .3s ease}
        html.dark .loading-overlay { background: rgba(30, 41, 59, 0.95); }
        .loading-spinner{width:48px;height:48px;border:4px solid var(--border);border-top:4px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1rem}
        .loading-text{color:var(--primary);font-weight:600;font-size:1.125rem}
        @keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}
        .exercise-item,.question-item{background:var(--surface-alt);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;transition:all .3s ease}.exercise-item:hover,.question-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.exercise-sentence,.question-text{font-size:1.125rem;font-weight:500;color:var(--text-primary);margin-bottom:1rem;line-height:1.7}.exercise-options,.question-options{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
        .option-btn{background:var(--surface);color:var(--primary);border:2px solid var(--primary-light);padding:.75rem 1.25rem;border-radius:12px;cursor:pointer;font-weight:500;transition:all .3s ease;position:relative}
        html.dark .option-btn { color: #f1f5f9; border-color: var(--border); }
        .option-btn:hover{transform:translateY(-2px);border-color:var(--primary);background-color:var(--primary-light);box-shadow:0 4px 12px rgba(217, 70, 239, 0.2)}
        .option-btn:disabled{cursor:not-allowed;opacity:.7}.option-btn:disabled:hover{transform:translateY(0);box-shadow:none;background-color:var(--surface)}.option-btn.correct{background:var(--secondary)!important;color:#fff!important;border-color:var(--secondary)!important}.option-btn.incorrect{background:#ef4444!important;color:#fff!important;border-color:#dc2626!important}.exercise-translation,.question-translation{font-style:italic;color:var(--text-secondary);font-size:.9rem}.exercise-feedback,.question-feedback{font-weight:600;margin-top:1rem;padding:.75rem 1rem;border-radius:8px;background:var(--surface-alt)}
        .table-container{overflow-x:auto;}table{width:100%;border-collapse:collapse;margin-top:1rem;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}th,td{padding:1rem 1.25rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}th{background:var(--surface-alt);font-weight:600;color:var(--text-primary)}tr:last-child td{border-bottom:none}tr:hover{background:rgba(217, 70, 239, 0.05)}
        .info-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}.card-title{font-size:1.125rem;font-weight:600;color:var(--primary);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}.card-title-alt{font-size:1.1rem;font-weight:600;margin-top:1rem;margin-bottom:.5rem;color:var(--text-primary)}.conversation-container{min-height:60vh;display:flex;flex-direction:column;background:var(--surface-alt);border-radius:16px;border:1px solid var(--border);overflow:hidden}.message-area{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}.chat-message{max-width:75%;padding:.875rem 1.25rem;border-radius:18px;font-weight:500;line-height:1.5;animation:messageAppear .3s ease-out}.chat-message.ai{background:var(--surface);border:1px solid var(--border);color:var(--text-primary);align-self:flex-start;border-bottom-left-radius:6px}.chat-message.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}@keyframes messageAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.chat-input-container{padding:1rem 1.5rem;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:1rem}.chat-input{flex:1;padding:.875rem 1.25rem;border:2px solid var(--border);border-radius:12px;outline:none;font-size:1rem;transition:all .3s ease;color:var(--text-primary);background-color:var(--surface-alt);}.chat-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(217, 70, 239, 0.1)}.chat-send-btn{background:var(--primary);color:#fff;border:none;padding:.875rem 1.5rem;border-radius:12px;cursor:pointer;font-weight:600;transition:all .3s ease}.chat-send-btn:hover{background:var(--primary-hover)}
        .audio-player{background:var(--surface-alt);border-radius:16px;padding:1.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem;border:1px solid var(--border)}.audio-controls{display:flex;align-items:center;gap:1rem}.audio-btn{background:var(--primary);color:#fff;border:none;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s ease;box-shadow:var(--shadow)}.audio-btn:hover{background:var(--primary-hover);transform:scale(1.05)}.audio-btn:disabled{background-color:var(--text-secondary);cursor:not-allowed;transform:none;opacity:.7}.audio-btn .spinning-loader{width:24px;height:24px;border:3px solid hsla(0,0%,100%,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}.audio-status{font-weight:500;color:var(--text-secondary);min-width:100px;text-align:center}.transcript-toggle-btn{background-color:var(--surface);color:var(--primary);border:1px solid var(--primary-light);padding:.5rem 1rem;border-radius:12px;cursor:pointer;font-weight:500;transition:all .3s ease}.transcript-toggle-btn:hover{background-color:var(--primary-light)}
        .speaking-practice-card{min-height:100px;display:flex;align-items:center;justify-content:center}.textarea-input{width:100%;min-height:100px;padding:1rem;border-radius:12px;border:2px solid var(--border);font-size:1rem;resize:vertical;background-color:var(--surface);color:var(--text-primary)}.textarea-input:focus{outline:none;border-color:var(--primary)}
        .pronunciation-record-btn { background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.75rem; box-shadow: var(--shadow); }
        .pronunciation-record-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-lg); }
        .pronunciation-record-btn.recording { animation: pulse 1.5s infinite; background: #ef4444; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: var(--shadow); } 50% { transform: scale(1.05); box-shadow: var(--shadow-lg); } 100% { transform: scale(1); box-shadow: var(--shadow); } }
        .pronunciation-score-card { background: var(--surface); border: 2px solid var(--primary-light); border-radius: 16px; padding: 1.5rem; text-align: center; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem; font-weight: 700; color: var(--primary); background: var(--primary-light); border: 5px solid var(--primary); }
        .chat-message .translation { font-size: 0.8rem; margin-top: 0.5rem; font-style: italic; color: var(--text-secondary); opacity: 0.8; }
        .chat-message.user .translation { color: #fbcfe8; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: var(--surface); margin: auto; padding: 2rem; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 90%; max-width: 700px; animation: fadeInScale 0.3s ease-out; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .close-button { color: var(--text-secondary); float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: var(--text-primary); text-decoration: none; cursor: pointer; }
        .correction-table th { background-color: var(--primary-light); color: var(--primary); }
        html.dark .correction-table th { background-color: #581c87; color: #f0abfc; }
        .correction-table td strong { color: var(--primary); }
        .unused-words-section { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-top: 1.5rem; }
        #unusedWordsList { color: var(--text-secondary) }
        @media (max-width: 768px) { .main-container { margin: 1.5rem auto; } .lookup-card, .content-section { padding: 1.5rem; } .header h1 { font-size: 2.25rem; } .tab-btn { padding: 0.75rem 1rem; } }
        @media (max-width: 640px) { .main-container { margin: 1rem auto; padding: 0 0.75rem; } .header { margin-bottom: 1.5rem; } .header h1 { font-size: 1.875rem; } .header p { font-size: 1rem; } .lookup-card, .content-section { padding: 1rem; border-radius: 1rem; } .input-group { flex-wrap: wrap; gap: 0.75rem; } .main-input { flex-basis: 100%; order: 1; text-align: center; } .primary-btn { flex-basis: 100%; order: 3; justify-content: center; } .icon-btn { padding: 0.5rem; } .input-group > .icon-btn:first-of-type { order: 2; margin-left: auto; } .input-group > .icon-btn:nth-of-type(2) { order: 2; margin-right: auto; } .features-grid { grid-template-columns: 1fr; } .content-section { padding: 1.5rem 1rem; } .section-header { font-size: 1.5rem; } .practice-actions { gap: 0.5rem; flex-wrap: wrap; justify-content: center; } .practice-actions .feature-btn, .practice-actions .primary-btn, .pronunciation-record-btn { padding: 0.75rem 1.25rem; font-size: 0.875rem; flex-grow: 0; justify-content: center; } }
    </style>
</head>
<body class="transition-colors duration-300">

    <div class="main-container">
        <header class="header relative">
            <div class="absolute top-0 right-0">
                <button id="theme-toggle" class="icon-btn p-2 rounded-full" title="Chuyển chế độ Sáng/Tối">
                    <svg id="theme-toggle-dark-icon" class="hidden h-6 w-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden h-6 w-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <h1>Chào mừng đến với <span>Chinese Mastery Hub</span></h1>
            <p>Công cụ học tiếng Trung toàn diện, tập trung vào Nghe & Nói</p>
        </header>

        <div class="lookup-card">
            <div class="input-group">
                <input type="text" class="main-input" id="vocabularyInput" placeholder="Nhập từ Tiếng Việt, Pinyin, hoặc chủ đề...">
                <button class="icon-btn" id="btnPasteClipboard" title="Dán từ clipboard">

                </button>
                <button class="icon-btn" id="btnClearInput" title="Xóa nội dung">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                </button>
                <button class="primary-btn" id="btnQuickSearch">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><path d="M8 11.5v-3"></path><path d="M14 11.5v-3"></path></svg>
                    Tra & Nghe
                </button>
            </div>
            <div class="message-alert" id="messageBox"></div>
            <div id="quickSearchResults" class="mt-4"></div>

    <script>
        // --- Theme Toggle Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        const applyTheme = () => {
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleLightIcon.classList.add('hidden');
            }
        };

        themeToggleBtn.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            applyTheme();
        });

        // --- Tabbed Interface Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(); 

            const tabs = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab).classList.add('active');
                });
            });
            attachEventListeners();
        });


        // --- Global State ---
        let conversationHistory = [];
        let currentUtteranceQueue = []; 
        let isSpeakingFullDialogue = false;
        let recognition; // Global variable for SpeechRecognition instance
        let isRecording = false; // To track recording state
        const loopPlaybackState = { active: false, text: '', button: null };

        // --- DOM Element References ---
        const vocabularyInput = document.getElementById('vocabularyInput');
        const messageBox = document.getElementById('messageBox');
        const contentResultsArea = document.getElementById('content-results-area');
        const quickSearchResults = document.getElementById('quickSearchResults');
        const correctionModal = document.getElementById('correctionModal');
        const closeCorrectionModalBtn = document.getElementById('closeCorrectionModal');
        const modalCorrectionContent = document.getElementById('modalCorrectionContent');
        const contentContainers = {};

        // --- UI Helper Functions ---
        function hideAllSections() {
            stopLoopPlayback();
            if (speechSynthesis.speaking || speechSynthesis.pending) {
                speechSynthesis.cancel();
            }
            if (recognition && typeof recognition.abort === 'function') {
                recognition.abort();
            }
            currentUtteranceQueue = []; 
            isSpeakingFullDialogue = false;
            
            if (isRecording) {
                if (recognition) recognition.stop();
                isRecording = false;
                const recordBtn = document.getElementById('record-pronunciation-btn');
                if (recordBtn) {
                    recordBtn.classList.remove('recording');
                    recordBtn.querySelector('span').textContent = 'Ghi âm & Chấm điểm';
                }
            }

            contentResultsArea.innerHTML = '';
            quickSearchResults.innerHTML = '';
            Object.keys(contentContainers).forEach(key => delete contentContainers[key]);
        }

        function createContentSection(featureKey, headerText) {
            hideAllSections();
            const containerId = `${featureKey}Container`;
            const overlayId = `${featureKey}LoadingOverlay`;
            const contentId = `${featureKey}Content`;

            const sectionHTML = `
                <div class="content-section" id="${containerId}" style="display: block;">
                    <div class="loading-overlay" id="${overlayId}">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">${headerText}...</div>
                    </div>
                    <div id="${contentId}"></div>
                </div>
            `;
            contentResultsArea.innerHTML = sectionHTML;
            
            contentContainers[featureKey] = {
                container: document.getElementById(containerId),
                overlay: document.getElementById(overlayId),
                content: document.getElementById(contentId)
            };
            
            document.getElementById(containerId).scrollIntoView({ behavior: 'smooth', block: 'start' });

            return contentContainers[featureKey];
        }

        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-alert show ${type}`;
        }

        function hideMessage() {
            messageBox.className = 'message-alert';
        }

        function clearInput() {
            vocabularyInput.value = '';
            hideMessage();
            vocabularyInput.focus();
            hideAllSections();
        }

        async function pasteFromClipboard() {
            hideMessage();
            if (!navigator.clipboard?.readText) {
                showMessage('Trình duyệt của bạn không hỗ trợ dán tự động. Vui lòng dùng tổ hợp phím Ctrl+V.', 'error');
                return;
            }
            try {
                const text = await navigator.clipboard.readText();
                vocabularyInput.value = text;
                showMessage('Đã dán thành công!', 'info');
            } catch (err) {
                console.error('Lỗi khi dán:', err);
                showMessage('Dán tự động bị chặn bởi trình duyệt. Vui lòng dùng Ctrl+V hoặc Cmd+V để dán.', 'error');
            }
        }
        
        // --- Main Feature Functions ---
        function openLink(type) {
            const vocabulary = vocabularyInput.value.trim();
            if (!vocabulary) {
                showMessage('Vui lòng nhập từ vựng để tìm kiếm.', 'error');
                return;
            }
            const urls = {
                googleTranslate: `https://translate.google.com/?sl=zh-CN&tl=vi&text=${encodeURIComponent(vocabulary)}&op=translate`,
                pleco: `https://www.pleco.com/`, // Pleco is an app, linking to its homepage.
                forvo: `https://forvo.com/search/${encodeURIComponent(vocabulary)}/zh/`,
                googleImages: `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(vocabulary)}`,
                youglish: `https://youglish.com/pronounce/${encodeURIComponent(vocabulary)}/chinese`
            };
            if (urls[type]) {
                window.open(urls[type], '_blank');
            }
        }

        async function callGemini(prompt, schema = null) {
             let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
             const payload = { contents: chatHistory };
             if (schema) {
                 payload.generationConfig = {
                     responseMimeType: "application/json",
                     responseSchema: schema
                 };
             }
             // IMPORTANT: API Key is required for this to work.
             // Replace "" with your actual Google AI Studio API key.
             const apiKey = "AIzaSyBmkjM3LfHN_Id8Yqeo_fea30wRdyTgxpc";
             const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
             
             const response = await fetch(apiUrl, {
                 method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify(payload)
             });
             
             if (!response.ok) {
                const errorBody = await response.text();
                console.error("API Error Response:", errorBody);
                throw new Error(`Lỗi API: ${response.status} ${response.statusText}`);
             }

             const result = await response.json();
             
             if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                 const text = result.candidates[0].content.parts[0].text;
                 try {
                     return JSON.parse(text);
                 } catch (e) {
                     console.error("Lỗi phân tích JSON:", e, "Dữ liệu gốc:", text);
                     throw new Error("Không thể phân tích phản hồi từ API. Phản hồi không phải là JSON hợp lệ.");
                 }
             }
             console.error("Phản hồi API không hợp lệ:", result);
             throw new Error('Cấu trúc phản hồi API không mong đợi hoặc trống.');
        }

        async function handleFeature(featureKey, headerText, promptGenerator, renderer, inputValidator = (input) => !!input) {
            const { container, content, overlay } = createContentSection(featureKey, `Đang ${headerText.toLowerCase()}`);

            let featureInput;
            if (featureKey === 'speakingPracticeManual') {
                featureInput = arguments[arguments.length - 1]; 
            } else {
                featureInput = vocabularyInput.value.trim();
            }

            if (!inputValidator(featureInput)) {
                showMessage(`Vui lòng nhập đầu vào hợp lệ cho chức năng này.`, 'error');
                hideAllSections();
                return;
            }

            try {
                if (['conversationSimulator', 'speakingPractice', 'speakingPracticeManual', 'pinyinPractice'].includes(featureKey)) {
                     await renderer(featureInput, content, headerText);
                } else {
                    const { prompt, schema } = promptGenerator(featureInput);
                    const data = await callGemini(prompt, schema);
                    // Debug logging for explanation feature
                    if (featureKey === 'explanation') {
                        console.log('Explanation API Response:', data);
                        console.log('Has synonyms:', !!data.synonyms, data.synonyms);
                        console.log('Has antonyms:', !!data.antonyms, data.antonyms);
                        console.log('Has collocations:', !!data.collocations, data.collocations);
                    }
                    renderer(data, content, headerText, featureInput);
                }
            } catch (error) {
                showMessage(`Có lỗi xảy ra khi tạo nội dung. Vui lòng thử lại.`, 'error');
                console.error(`Lỗi với chức năng ${featureKey}:`, error);
                content.innerHTML = `<p class="text-red-500 font-semibold">Đã xảy ra lỗi: ${error.message}</p>`;
            } finally {
                if (overlay) overlay.style.display = 'none';
            }
        }
        
        // --- RENDERERS ---
        const renderers = {
             quickLookup: (data, el) => {
                el.innerHTML = `
                    <div class="info-card p-4">
                      <div class="flex items-center gap-4">
                         <button class="audio-btn" style="width: 44px; height: 44px; min-width: 44px;" onclick="speakText('${data.hanzi.replace(/'/g, "\\'")}')" title="Nghe lại">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-1.414 1.414A6.472 6.472 0 0 1 12.026 8c0 1.966-.893 3.738-2.29 4.949l1.414 1.414z"/><path d="M10.121 12.596A6.48 6.48 0 0 0 12.026 8a6.48 6.48 0 0 0-1.905-4.596l-1.414 1.414A4.486 4.486 0 0 1 10.026 8c0 1.353-.6 2.544-1.515 3.328l1.414 1.414zM8.707 11.182A4.5 4.5 0 0 0 10.026 8a4.5 4.5 0 0 0-1.319-3.182L8.707 5.18a2.5 2.5 0 0 1 0 5.64l.001.002zM6.343 4.828a.5.5 0 0 0 0 .707L7.05 6.243a.5.5 0 0 0 .707 0l.707-.707a.5.5 0 0 0 0-.707L7.757 4.12a.5.5 0 0 0-.707 0l-.708.707zM4.717 6.464a.5.5 0 0 0 0 .708L5.424 7.88a.5.5 0 0 0 .707 0l.707-.707a.5.5 0 0 0 0-.708L6.128 5.757a.5.5 0 0 0-.707 0l-.708.707zM2 8a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1A.5.5 0 0 1 2 8z"/></svg>
                         </button>
                         <div>
                            <p class="text-xl font-semibold text-fuchsia-600 dark:text-fuchsia-400">${data.pinyin}</p>
                            <p class="mt-1 text-lg">${data.meaning}</p>
                         </div>
                      </div>
                    </div>
                `;
            },
            examples: (data, el, headerText) => {
                el.innerHTML = `
                    <h2 class="section-header">💡 ${headerText}</h2>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>Pinyin</th><th>Tiếng Việt</th><th>Phát âm</th></tr></thead>
                            <tbody>
                            ${data.map(item => `
                                <tr>
                                    <td class="font-mono">${item.pinyin}</td>
                                    <td>${item.vietnamese}</td>
                                    <td>
                                        <button class="icon-btn" onclick="speakText('${item.hanzi.replace(/'/g, "\\'")}')" title="Nghe câu này">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-1.414 1.414A6.472 6.472 0 0 1 12.026 8c0 1.966-.893 3.738-2.29 4.949l1.414 1.414zM8.707 11.182A4.5 4.5 0 0 0 10.026 8a4.5 4.5 0 0 0-1.319-3.182L8.707 5.18a2.5 2.5 0 0 1 0 5.64l.001.002z"/></svg>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },
            exercise: (data, el, headerText) => {
                el.innerHTML = `<h2 class="section-header">✨ ${headerText}</h2>` + data.map(item => `
                    <div class="exercise-item" data-hanzi="${item.hanzi_sentence.replace(/"/g, '&quot;')}">
                        <p class="exercise-sentence font-mono">${item.id}. ${item.pinyin_with_blank}</p>
                        <div class="exercise-options">${item.options.map(option => `<button class="option-btn font-mono" data-value="${option.replace(/"/g, '&quot;')}" onclick="checkFillInBlankAnswer(this, '${item.correct_word_pinyin.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>
                        <p class="exercise-translation">(Dịch: ${item.translation})</p>
                        <div class="exercise-feedback"></div>
                    </div>`).join('');
            },
            listeningFillInTheBlank: (data, el, headerText) => {
                 el.innerHTML = `<h2 class="section-header">🎧 ${headerText}</h2>` + data.map(item => `
                    <div class="exercise-item">
                        <div class="flex items-center gap-4 mb-4">
                             <button class="audio-btn" onclick="playQuestionAudio(this, '${item.hanzi_sentence.replace(/'/g, "\\'")}')" title="Nghe câu">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M10.804 8 5 4.633v6.734L10.804 8zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm15 0a7 7 0 1 0-14 0 7 7 0 0 0 14 0z"/></svg>
                             </button>
                             <p class="exercise-sentence flex-1 font-mono">${item.id}. ${item.pinyin_with_blank}</p>
                        </div>
                        <div class="exercise-options">${item.options.map(option => `<button class="option-btn font-mono" data-value="${option.replace(/"/g, '&quot;')}" onclick="checkFillInBlankAnswer(this, '${item.correct_word_pinyin.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>
                        <p class="exercise-translation">(Dịch: ${item.translation})</p>
                        <div class="exercise-feedback"></div>
                    </div>`).join('');
            },
            explanation: (data, el, headerText, originalInput) => {
                // Ensure data has all required fields with defaults
                if (!data) {
                    console.error('Explanation data is null or undefined');
                    data = {};
                }
                data.synonyms = data.synonyms || [];
                data.antonyms = data.antonyms || [];
                data.collocations = data.collocations || [];
                data.memory_tips = data.memory_tips || [];
                
                console.log('Rendering explanation with data:', {
                    hasSynonyms: data.synonyms?.length || 0,
                    hasAntonyms: data.antonyms?.length || 0,
                    hasCollocations: data.collocations?.length || 0,
                    hasMemoryTips: data.memory_tips?.length || 0
                });
                
                const renderStars = (rating) => {
                    const fullStars = Math.round(rating);
                    const emptyStars = 5 - fullStars;
                    return '★'.repeat(fullStars) + '☆'.repeat(emptyStars);
                };
                
                const renderWordList = (items, title, icon, alwaysShow = false) => {
                    if (!items || !Array.isArray(items) || items.length === 0) {
                        if (alwaysShow) {
                            return `
                                <div class="info-card">
                                    <h3 class="card-title">${icon} ${title}</h3>
                                    <div class="space-y-3">
                                        <p class="text-slate-500 dark:text-slate-400 italic text-center py-4">Chưa có dữ liệu</p>
                                    </div>
                                </div>
                            `;
                        }
                        return '';
                    }

        function highlightPinyinDifferences(target, typed) {
            // Simple word-by-word comparison for Pinyin
            const targetWords = target.toLowerCase().split(/\s+/).filter(w => w);
            const typedWords = typed.toLowerCase().split(/\s+/).filter(w => w);
            let highlightedTyped = [];
            for (let i = 0; i < Math.max(targetWords.length, typedWords.length); i++) {
                if (typedWords[i] === undefined) break;
                if (targetWords[i] === typedWords[i]) {
                    highlightedTyped.push(typedWords[i]);
                } else {
                    highlightedTyped.push(`<span class="bg-red-200 text-red-700 px-1 rounded">${typedWords[i] || ''}</span>`);
                }
            }
            return highlightedTyped.join(' ');
        }

        function startSpeakingPracticeManual() {
            const modal = document.getElementById('manualSpeakingModal');
            modal.style.display = 'flex';
            document.getElementById('startManualPracticeBtn').onclick = () => {
                const sentencesText = document.getElementById('manualSentencesInput').value.trim();
                const sentences = sentencesText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                if (sentences.length === 0) {
                    showMessage('Vui lòng nhập ít nhất một câu để luyện tập.', 'error');
                    return;
                }
                modal.style.display = 'none';
                handleFeature('speakingPracticeManual', 'Luyện phản xạ thủ công', null, 
                    (input, content, headerText) => renderers.speakingPracticeManual(sentences, content, headerText),
                    (input) => input.length > 0
                );
            };
            document.getElementById('closeManualSpeakingModal').onclick = () => { modal.style.display = 'none'; };
            modal.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; };
        }

        // --- Interactive Answer Checking ---
        function checkFillInBlankAnswer(button, correctWord) {
            const item = button.closest('.exercise-item');
            const feedback = item.querySelector('.exercise-feedback');
            const options = item.querySelectorAll('.option-btn');
            const hanziSentence = item.dataset.hanzi;
            
            options.forEach(btn => btn.disabled = true);
            
            const speakButtonHTML = hanziSentence 
                ? `<button class="icon-btn" onclick="speakText('${hanziSentence.replace(/'/g, "\\'")}')" title="Nghe lại"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-1.414 1.414A6.472 6.472 0 0 1 12.026 8c0 1.966-.893 3.738-2.29 4.949l1.414 1.414z"/></svg></button>` 
                : '';

            if (button.dataset.value === correctWord) {
                button.classList.add('correct');
                feedback.innerHTML = `Chính xác! 🎉 ${speakButtonHTML}`;
            } else {
                button.classList.add('incorrect');
                feedback.innerHTML = `Sai rồi. Đáp án đúng là "<b class="font-mono">${correctWord}</b>". ${speakButtonHTML}`;
                const correctButton = item.querySelector(`button[data-value="${correctWord.replace(/"/g, '&quot;')}"]`);
                if(correctButton) correctButton.classList.add('correct');
            }
        }

        function checkMultipleChoiceAnswer(button) {
            const item = button.closest('.question-item');
            const feedbackEl = item.querySelector('.question-feedback');
            const correctAnswer = item.dataset.correctAnswer;
            const questionTranslation = item.dataset.questionTranslation;

            item.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            if (button.textContent === correctAnswer) {
                button.classList.add('correct');
                feedbackEl.innerHTML = `Chính xác! 🎉 <br><span class="question-translation">(Câu hỏi: ${questionTranslation})</span>`;
            } else {
                button.classList.add('incorrect');
                const correctBtn = Array.from(item.querySelectorAll('.option-btn')).find(b => b.textContent === correctAnswer);
                if (correctBtn) correctBtn.classList.add('correct');
                feedbackEl.innerHTML = `Sai rồi. Đáp án đúng là: "<b class="font-mono">${correctAnswer}</b>" <br><span class="question-translation">(Câu hỏi: ${questionTranslation})</span>`;
            }
        }
        
        // --- Audio Player & Speech Recognition Logic ---
        function createChineseUtterance(textInHanzi, { showError = true } = {}) {
            const utterance = new SpeechSynthesisUtterance(textInHanzi);
            const voices = speechSynthesis.getVoices().filter(voice => voice.lang.startsWith('zh'));
            if (voices.length === 0) {
                if (showError) {
                    showMessage('Không tìm thấy giọng đọc Tiếng Trung trên trình duyệt này.', 'error');
                }
                return null;
            }
            utterance.voice = voices.find(v => v.name.includes('Google') && v.lang === 'zh-CN') || voices.find(v => v.lang === 'zh-CN') || voices[0];
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            return utterance;
        }

        function speakText(textInHanzi) {
            if (!('speechSynthesis' in window)) {
                showMessage('Trình duyệt không hỗ trợ phát âm thanh.', 'error');
                return;
            }
            stopLoopPlayback();
            if (speechSynthesis.speaking && !isSpeakingFullDialogue) {
                speechSynthesis.cancel();
            }
            const utterance = createChineseUtterance(textInHanzi);
            if (!utterance) return;
            utterance.onerror = (event) => console.error("Lỗi phát âm thanh:", event);
            speechSynthesis.speak(utterance);
        }

        function playQuestionAudio(button, textInHanzi) {
             if (!('speechSynthesis' in window)) return;
             if (speechSynthesis.speaking) speechSynthesis.cancel();
             const utterance = createChineseUtterance(textInHanzi);
             if (!utterance) return;
            
            const originalIconSVG = button.innerHTML;
            button.innerHTML = `<div class="spinning-loader"></div>`;
            button.disabled = true;
            utterance.onend = () => { button.innerHTML = originalIconSVG; button.disabled = false; };
            utterance.onerror = (e) => { button.innerHTML = originalIconSVG; button.disabled = false; console.error("Lỗi phát âm:", e); };
            speechSynthesis.speak(utterance);
        }

        function toggleLoopPlayback(button, textInHanzi) {
            if (!textInHanzi) return;
            if (!('speechSynthesis' in window)) {
                showMessage('Trình duyệt không hỗ trợ phát âm thanh.', 'error');
                return;
            }
            if (loopPlaybackState.active && loopPlaybackState.button === button) {
                stopLoopPlayback();
                return;
            }
            startLoopPlayback(button, textInHanzi);
        }

        function startLoopPlayback(button, textInHanzi) {
            stopLoopPlayback();
            loopPlaybackState.active = true;
            loopPlaybackState.text = textInHanzi;
            loopPlaybackState.button = button;
            if (!button.dataset.loopDefault) {
                button.dataset.loopDefault = button.innerHTML;
            }
            button.dataset.loopState = 'playing';
            button.innerHTML = button.dataset.loopStop || '⏹ Dừng lặp';
            playLoopUtterance();
        }

        function playLoopUtterance() {
            if (!loopPlaybackState.active) return;
            const utterance = createChineseUtterance(loopPlaybackState.text, { showError: !loopPlaybackState.button });
            if (!utterance) {
                stopLoopPlayback();
                return;
            }
            utterance.onend = () => {
                if (loopPlaybackState.active) {
                    setTimeout(playLoopUtterance, 250);
                }
            };
            utterance.onerror = (err) => {
                console.error('Loop playback error:', err);
                stopLoopPlayback();
            };
            speechSynthesis.speak(utterance);
        }

        function stopLoopPlayback() {
            if (loopPlaybackState.active && 'speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            if (loopPlaybackState.button) {
                const btn = loopPlaybackState.button;
                const defaultHtml = btn.dataset.loopDefault || '🔁 Nghe liên tục';
                btn.innerHTML = defaultHtml;
                btn.dataset.loopState = 'stopped';
            }
            loopPlaybackState.active = false;
            loopPlaybackState.text = '';
            loopPlaybackState.button = null;
        }
        
        function setupAudioPlayer(scriptInHanzi, container) {
            container.innerHTML = `<div class="audio-player"><div class="audio-controls"><button id="audioPlayBtn" class="audio-btn" title="Phát"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M10.804 8 5 4.633v6.734L10.804 8zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm15 0a7 7 0 1 0-14 0 7 7 0 0 0 14 0z"/></svg></button><button id="audioPauseBtn" class="audio-btn" title="Tạm dừng" style="display: none;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M6 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5zm4 0a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm15 0a7 7 0 1 0-14 0 7 7 0 0 0 14 0z"/></svg></button><button id="audioStopBtn" class="audio-btn" title="Dừng"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v4a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 0 1H6.5a.5.5 0 0 1 0-1H10.5zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm15 0a7 7 0 1 0-14 0 7 7 0 0 0 14 0z"/></svg></button></div><div id="audioStatus" class="audio-status">Sẵn sàng</div></div>`;
            const playBtn = document.getElementById('audioPlayBtn'), pauseBtn = document.getElementById('audioPauseBtn'), stopBtn = document.getElementById('audioStopBtn'), statusDiv = document.getElementById('audioStatus');
            if (!('speechSynthesis' in window)) { statusDiv.textContent = 'Trình duyệt không hỗ trợ'; playBtn.disabled = true; return; }

            let utterance = new SpeechSynthesisUtterance(scriptInHanzi);
            const setVoice = () => {
                const voices = speechSynthesis.getVoices().filter(voice => voice.lang.startsWith('zh'));
                if (voices.length > 0) { utterance.voice = voices.find(v => v.name.includes('Google') && v.lang === 'zh-CN') || voices.find(v => v.lang === 'zh-CN') || voices[0]; utterance.lang = 'zh-CN';}
            };
            setVoice();
            if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = setVoice;

            utterance.onstart = () => { statusDiv.textContent = 'Đang phát...'; playBtn.style.display = 'none'; pauseBtn.style.display = 'flex'; };
            utterance.onpause = () => { statusDiv.textContent = 'Đã tạm dừng'; playBtn.style.display = 'flex'; pauseBtn.style.display = 'none'; };
            utterance.onresume = () => { statusDiv.textContent = 'Đang phát...'; playBtn.style.display = 'none'; pauseBtn.style.display = 'flex'; };
            utterance.onend = () => { statusDiv.textContent = 'Đã kết thúc'; playBtn.style.display = 'flex'; pauseBtn.style.display = 'none'; };
            utterance.onerror = (e) => { console.error(e); statusDiv.textContent = 'Lỗi phát âm'; playBtn.style.display = 'flex'; pauseBtn.style.display = 'none'; };

            playBtn.addEventListener('click', () => { if (speechSynthesis.paused) { speechSynthesis.resume(); } else { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(utterance), 100); } });
            pauseBtn.addEventListener('click', () => { if (speechSynthesis.speaking) speechSynthesis.pause(); });
            stopBtn.addEventListener('click', () => { if (speechSynthesis.speaking || speechSynthesis.paused) speechSynthesis.cancel(); });
        }
        
        async function handlePronunciationRecording(sentenceData) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showMessage('Trình duyệt của bạn không hỗ trợ nhận dạng giọng nói.', 'error');
                return;
            }

            const recordBtn = document.getElementById('record-pronunciation-btn');
            const scoreContainer = document.getElementById('pronunciation-score-container');
            if (isRecording) { if (recognition) recognition.stop(); return; }

            let targetData = sentenceData;

            // Fetch suggestion if not already present
            if (!targetData.hanzi_suggestion) {
                 scoreContainer.innerHTML = '<p class="text-center font-semibold">Đang lấy câu gợi ý...</p>';
                 scoreContainer.classList.remove('hidden');
                 try {
                    const { prompt, schema } = prompts.speakingPractice(targetData.vietnamese_sentence);
                    targetData = await callGemini(prompt, schema);
                    scoreContainer.classList.add('hidden'); 
                    scoreContainer.innerHTML = ''; 
                 } catch (error) {
                    showMessage('Không thể lấy câu gợi ý để chấm điểm.', 'error');
                    scoreContainer.classList.add('hidden');
                    return;
                 }
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN'; // Set to Mandarin Chinese
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const recordBtnSpan = recordBtn.querySelector('span');
            recognition.onstart = () => {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtnSpan.textContent = 'Đang ghi âm...';
                scoreContainer.classList.add('hidden');
            };

            recognition.onresult = async (event) => {
                const spokenTextHanzi = event.results[0][0].transcript;
                scoreContainer.innerHTML = '<p class="text-center font-semibold">Đang chuyển sang Pinyin & chấm điểm...</p>';
                scoreContainer.classList.remove('hidden');

                try {
                    // Convert recognized Hanzi to Pinyin for display
                    const { prompt: pinyinPrompt, schema: pinyinSchema } = prompts.convertToPinyin(spokenTextHanzi);
                    const pinyinResult = await callGemini(pinyinPrompt, pinyinSchema);
                    const spokenTextPinyin = pinyinResult.pinyin;

                    // Get score using original Hanzi for accuracy
                    const {prompt: scorePrompt, schema: scoreSchema} = prompts.pronunciationScore(targetData.hanzi_suggestion, spokenTextHanzi);
                    const result = await callGemini(scorePrompt, scoreSchema);
                    
                    // Display result with Pinyin
                    scoreContainer.innerHTML = `
                        <div class="pronunciation-score-card">
                            <div class="score-circle">${result.score}%</div>
                            <h4 class="card-title-alt">Bạn đã nói (Pinyin):</h4>
                            <p class="text-lg italic font-mono">"${spokenTextPinyin}"</p>
                            <h4 class="card-title-alt mt-4">Câu trả lời gợi ý (Pinyin):</h4>
                            <p class="text-lg font-medium text-green-600 font-mono">"${targetData.pinyin_suggestion}"</p>
                            <h4 class="card-title-alt mt-4">Nhận xét của AI:</h4>
                            <p>${result.feedback}</p>
                        </div>
                    `;

                } catch (error) {
                    console.error('Lỗi chấm điểm phát âm:', error);
                    scoreContainer.innerHTML = `<p class="text-red-500">Lỗi khi xử lý kết quả: ${error.message}</p>`;
                }
            };
            recognition.onerror = (event) => { showMessage(`Lỗi ghi âm: ${event.error}`, 'error'); };
            recognition.onend = () => {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtnSpan.textContent = 'Ghi âm & Chấm điểm';
            };
            recognition.start();
        }

        function playFullDialogue(hanziLines) {
            if (!('speechSynthesis' in window)) return;
            if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); 

            isSpeakingFullDialogue = true;
            currentUtteranceQueue = [...hanziLines]; 
            if (isRecording) { if (recognition) recognition.stop(); }

            const speakNextLine = () => {
                if (currentUtteranceQueue.length > 0 && isSpeakingFullDialogue) {
                    const line = currentUtteranceQueue.shift();
                    const utterance = new SpeechSynthesisUtterance(line);
                     const voices = speechSynthesis.getVoices().filter(voice => voice.lang.startsWith('zh'));
                     if (voices.length > 0) {
                        utterance.voice = voices.find(v => v.name.includes('Google') && v.lang === 'zh-CN') || voices[0];
                        utterance.lang = 'zh-CN';
                        utterance.rate = 0.9;
                     }
                    utterance.onend = () => speakNextLine(); 
                    utterance.onerror = (e) => { console.error(e); speakNextLine(); };
                    speechSynthesis.speak(utterance);
                } else {
                    isSpeakingFullDialogue = false; 
                }
            };
            speakNextLine(); 
        }

        // --- Conversation Simulator Logic ---
        async function getNextAiResponse() {
            const chatInput = document.getElementById('chatInput');
            const chatSendButton = document.getElementById('chatSendButton');
            try {
                const context = conversationHistory.map(turn => `${turn.role}: ${turn.parts[0].text}`).join('\n');
                const lastUserMessage = conversationHistory.length > 1 ? conversationHistory[conversationHistory.length - 1].parts[0].text : "(bắt đầu)";
                const { prompt, schema } = prompts.conversationTurn(context, lastUserMessage);
                const aiResponse = await callGemini(prompt, schema);
                
                const modelResponse = { role: 'model', parts: [{ text: aiResponse.hanzi }] };
                conversationHistory.push(modelResponse);
                addMessageToUI(aiResponse.pinyin, aiResponse.vietnamese, 'ai', aiResponse.hanzi);
            } catch (error) {
                console.error("Lỗi hội thoại:", error);
                addMessageToUI('Duìbùqǐ, wǒ hǎoxiàng yǒudiǎn wèntí.', 'Xin lỗi, tôi có chút vấn đề.', 'ai', '对不起，我好像有点问题。');
            } finally {
                if (chatInput) chatInput.disabled = false;
                if (chatSendButton) chatSendButton.disabled = false;
            }
        }

        function addMessageToUI(pinyinText, vietnameseTranslation, sender, hanziText) {
            const messageArea = document.getElementById('messageArea');
            if (!messageArea) return;
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;
            messageDiv.innerHTML = `
                <div class="flex items-start justify-between">
                    <div>
                        <span class="font-mono">${pinyinText}</span>
                        <p class="translation">(Dịch: ${vietnameseTranslation})</p>
                    </div>
                     <button class="icon-btn" onclick="speakText('${hanziText.replace(/'/g, "\\'")}')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-1.414 1.414A6.472 6.472 0 0 1 12.026 8c0 1.966-.893 3.738-2.29 4.949l1.414 1.414z"/></svg>
                    </button>
                </div>
            `;
            messageArea.appendChild(messageDiv);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        async function continueConversation() {
            const chatInput = document.getElementById('chatInput');
            const chatSendButton = document.getElementById('chatSendButton');
            if (!chatInput) return;
            
            const userMessagePinyin = chatInput.value.trim();
            if (!userMessagePinyin) return;

            chatInput.disabled = true;
            if(chatSendButton) chatSendButton.disabled = true;

            const userTurn = { role: 'user', parts: [{ text: userMessagePinyin }] };
            conversationHistory.push(userTurn);
            
            // We show the user's pinyin immediately, but we need Hanzi and translation for the bubble
            // We can show a temporary message and update it
            addMessageToUI(userMessagePinyin, "Đang dịch...", 'user', '');


            try {
                const { prompt, schema } = prompts.conversationCorrection(userMessagePinyin);
                const correctionResult = await callGemini(prompt, schema);

                // Update the user's last message bubble with the corrected info
                const lastMessageBubble = document.querySelector('.chat-message.user:last-child');
                if (lastMessageBubble) {
                    addMessageToUI(userMessagePinyin, correctionResult.vietnameseTranslation, 'user', '');
                    lastMessageBubble.remove(); // remove the temporary one
                }

                if (!correctionResult.isCorrect) {
                    showCorrectionModal(correctionResult);
                }
            } catch (error) {
                console.error("Lỗi kiểm tra ngữ pháp:", error);
            }
            
            chatInput.value = '';
            await getNextAiResponse();
        }

        function showCorrectionModal(data) {
            modalCorrectionContent.innerHTML = `
                <div class="table-container">
                <table class="correction-table w-full">
                    <tr> <th class="w-1/3">Mục</th> <th>Nội dung</th> </tr>
                    <tr> <td>📥 Pinyin gốc</td> <td class="font-mono">${data.originalPinyin}</td> </tr>
                    <tr> <td>✅ Pinyin đã sửa</td> <td class="font-mono">${data.correctedPinyin}</td> </tr>
                    <tr> <td>🛠️ Ghi chú</td> <td>${data.correctionNotes}</td> </tr>
                    <tr> <td>🇳 Dịch nghĩa</td> <td>${data.vietnameseTranslation}</td> </tr>
                </table>
                </div>
            `;
            correctionModal.style.display = 'flex';
        }

        async function quickSearch() {
            const input = vocabularyInput.value.trim();
            if (!input) {
                showMessage('Vui lòng nhập từ hoặc cụm từ để tra cứu.', 'error');
                return;
            }
            hideAllSections(); 
            quickSearchResults.innerHTML = `<div class="info-card p-4 flex items-center justify-center"> <div class="loading-spinner"></div> <span class="ml-3 text-gray-600 dark:text-gray-300">Đang tra cứu...</span> </div>`;
            
            try {
                const { prompt, schema } = prompts.quickLookup(input);
                const data = await callGemini(prompt, schema);
                renderers.quickLookup(data, quickSearchResults);
                speakText(data.hanzi);
            } catch (error) {
                showMessage('Không thể tra cứu. Vui lòng thử lại.', 'error');
                console.error('Lỗi tra cứu nhanh:', error);
                quickSearchResults.innerHTML = `<div class="info-card p-4 text-center text-red-600 dark:text-red-400">Không tìm thấy kết quả cho "${input}".</div>`;
            }
        }

            closeCorrectionModalBtn.addEventListener('click', () => { correctionModal.style.display = 'none'; });

        }
    </script>
